<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bank it!</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png?v=1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
<link rel="manifest" href="manifest.webmanifest?v=1">
<meta name="apple-mobile-web-app-title" content="Bank it!">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFC53D">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Charte Bank it! : fond crème / nuit, aplat raisin, cartes vives, Fredoka pour les chiffres, Nunito pour le texte.
   Mise en page : un écran = la hauteur du téléphone, une action principale en bas à portée du pouce,
   défilement seulement dans une zone .scroll quand le contenu dépasse. */
:root{
  --surface:#F7F0E4;--surface-raised:#FFFFFF;--line:#E3D9C8;--ink:#1A1433;--ink-muted:#5E5677;--on-color:#1A1433;
  --grape:#6C4BE0;--grape-deep:#5636C4;--grape-text:#6C4BE0;--on-grape:#FFFFFF;
  --coin:#FFC53D;--coin-hi:#FFE38F;--coin-lo:#E5A200;--mint:#3FD9A0;--sky:#8CCFF2;--lime:#C4E53C;--bubble:#F4A3D3;--coral:#FF8A5B;--lilac:#B9A4FF;
  --bust:#D93A40;--on-bust:#FFFFFF;--bust-text:#D93A40;--focus:#6C4BE0;--press:rgba(26,20,51,.9);--card-shadow:rgba(26,20,51,.12);
  --shine:rgba(255,255,255,.38);--veil:rgba(26,20,51,.45);
  --font-display:"Fredoka","Nunito",system-ui,sans-serif;--font-body:"Nunito",system-ui,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;
  --radius-sm:10px;--radius-md:18px;--radius-lg:28px;--radius-xl:44px;--radius-pill:999px;
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#17122B;--surface-raised:#241D3E;--line:#3A3160;--ink:#F5EFFF;--ink-muted:#B5ABCF;--grape-text:#A48CFF;--bust-text:#FF6B6E;--focus:#A48CFF;--press:rgba(0,0,0,.55);--card-shadow:rgba(0,0,0,.35);--veil:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--surface:#17122B;--surface-raised:#241D3E;--line:#3A3160;--ink:#F5EFFF;--ink-muted:#B5ABCF;--grape-text:#A48CFF;--bust-text:#FF6B6E;--focus:#A48CFF;--press:rgba(0,0,0,.55);--card-shadow:rgba(0,0,0,.35);--veil:rgba(0,0,0,.6);color-scheme:dark}

/* ---- Verrou : pas de zoom, pas de sélection, pas de défilement de page ---- */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body{background:var(--surface);color:var(--ink);font:400 16px/24px var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img,svg{-webkit-user-drag:none}

.app{position:relative;max-width:460px;height:100%;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:var(--space-3);padding-block:var(--space-3) var(--space-4)}
.screen>*{flex:none;min-width:0}
.screen>.spacer{flex:1;min-height:0}
.scroll{flex:1 1 auto!important;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-6px;padding:2px 6px 8px}
.scroll::-webkit-scrollbar{display:none}
.stack{display:flex;flex-direction:column;gap:var(--space-3)}

/* ---- Transitions d'écran ---- */
.in-fwd{animation:inFwd .44s var(--out) backwards}
.out-fwd{animation:outFwd .3s ease-in both}
.in-back{animation:inBack .44s var(--out) backwards}
.out-back{animation:outBack .3s ease-in both}
.in-up{animation:inUp .5s var(--out) backwards}
.out-up{animation:outUp .28s ease-in both}
@keyframes inFwd{from{transform:translateX(44px);opacity:0}}
@keyframes outFwd{to{transform:translateX(-44px);opacity:0}}
@keyframes inBack{from{transform:translateX(-44px);opacity:0}}
@keyframes outBack{to{transform:translateX(44px);opacity:0}}
@keyframes inUp{from{transform:translateY(28px) scale(.97);opacity:0}}
@keyframes outUp{to{transform:scale(.96);opacity:0}}
.out-fwd,.out-back,.out-up{pointer-events:none}
.st{animation:rise .55s var(--spring) backwards;animation-delay:calc(var(--i,0) * 60ms + 80ms)}
.still .st,.still .q{animation:none}
@keyframes rise{from{transform:translateY(16px);opacity:0}}

h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h2{font-size:32px;line-height:36px;font-weight:700}
h3{font-size:22px;line-height:26px;font-weight:600}
p{margin:0}
.muted{color:var(--ink-muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);min-height:44px}
.top h3{flex:1;text-align:center}
.ph{width:44px;flex:none}
.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--surface-raised);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s var(--spring)}
.icon-btn:active{transform:scale(.88)}
.icon-btn svg,.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* ---- Accueil ---- */
.hero{position:relative;background:var(--bubble);border-radius:var(--radius-xl);padding:var(--space-5) var(--space-5) 0;overflow:hidden;display:flex;flex-direction:column;align-items:center;flex:1 1 auto!important;min-height:220px}
.hero .word{width:min(100%,290px);height:auto;flex:none;animation:wordIn .8s var(--spring) .15s both;position:relative;z-index:1}
@keyframes wordIn{from{transform:scale(.55) rotate(-8deg);opacity:0}}
.hero .tag{color:var(--on-color);font:800 15px/20px var(--font-body);margin-top:var(--space-2);opacity:.9;animation:rise .6s var(--out) .45s both;position:relative;z-index:1}
.word .wi{fill:var(--on-color)}.word .wc{fill:var(--coin);stroke:var(--on-color);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:dot 2.8s var(--spring) 1s infinite}
@keyframes dot{0%,70%,100%{transform:none}78%{transform:translateY(-14px) scale(1.15)}86%{transform:scale(1.1,.85)}}
.pip-stage{position:relative;flex:1;min-height:90px;width:100%;margin-top:var(--space-2)}
.pip-bob{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.pipsvg{height:100%;max-height:300px;width:auto;max-width:100%;display:block;margin-bottom:-6px;cursor:pointer;overflow:visible}
.pipsvg .pip-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,44%,49%,100%{transform:none}46.5%{transform:scaleY(.08)}}
.pipsvg .pip-pupils{transition:transform .3s var(--out)}
.pip-drop .pip-coin{animation:drop 3.2s infinite}
@keyframes drop{0%{transform:translateY(-120px);opacity:0;animation-timing-function:cubic-bezier(.55,0,.85,.35)}6%{opacity:1}48%{transform:translateY(48px);opacity:1}49%,100%{transform:translateY(48px);opacity:0}}
.pip-drop .pip-body{transform-box:fill-box;transform-origin:50% 100%;animation:gulp 3.2s infinite}
@keyframes gulp{0%,40%,72%,100%{transform:none}50%{transform:scale(1.05,.93)}60%{transform:scale(.98,1.03)}}
.pipsvg.tickle .pip-body{animation:tickle .5s var(--spring)}
@keyframes tickle{40%{transform:scale(1.1,.9)}70%{transform:scale(.95,1.06)}}
.dec{position:absolute;border-radius:50%;opacity:.85;animation:float 7s ease-in-out infinite}
.dec.d1{width:26px;height:26px;background:var(--coin);border:4px solid var(--on-color);left:9%;top:38%;animation-delay:-1s}
.dec.d2{width:14px;height:14px;background:var(--mint);right:12%;top:30%;animation-delay:-3s}
.dec.d3{width:20px;height:20px;background:var(--sky);left:16%;bottom:16%;animation-delay:-5s}
.dec.d4{width:12px;height:12px;background:var(--surface-raised);right:20%;bottom:28%;animation-delay:-2s}
.dec.d5{width:30px;height:30px;background:var(--lime);right:6%;bottom:10%;animation-delay:-4s;border-radius:10px;opacity:.7}
@keyframes float{0%,100%{transform:translate(0,0) rotate(0)}33%{transform:translate(6px,-12px) rotate(25deg)}66%{transform:translate(-5px,6px) rotate(-15deg)}}
.menu{display:grid;gap:var(--space-3)}

/* ---- Boutons ---- */
.btn{position:relative;font:800 17px/1 var(--font-body);min-height:60px;padding:0 var(--space-5);border:0;border-radius:var(--radius-md);cursor:pointer;box-shadow:0 5px 0 var(--press);transition:transform .12s var(--out),box-shadow .12s var(--out),opacity .2s;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);width:100%;color:var(--on-color);text-align:left;overflow:hidden}
.btn:active{transform:translateY(5px) scale(.985);box-shadow:0 0 0 var(--press)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--press)}
.btn .lbl{display:flex;flex-direction:column;gap:5px;min-width:0}
.btn small{font:700 13px/16px var(--font-body);opacity:.82}
.btn .big{font:700 22px/1 var(--font-display)}
.btn .ico{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--shine)}
.btn-primary{background:var(--grape);color:var(--on-grape)}
.btn-plus{background:var(--mint)}.btn-bank{background:var(--coin)}
.btn-ghost{background:var(--surface-raised);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line);justify-content:center;gap:var(--space-2)}
.btn-ghost:active{box-shadow:0 0 0 var(--line)}
.btn-ghost .ico{width:auto;height:auto;background:none}
.btn-shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,var(--shine) 50%,transparent 65%);transform:translateX(-130%);animation:shine 4s ease-in-out 1.4s infinite;pointer-events:none}
@keyframes shine{0%{transform:translateX(-130%)}30%,100%{transform:translateX(130%)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}

/* ---- Carte question ---- */
.q{background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:0 12px 28px var(--card-shadow);padding:var(--space-5);animation:deal .7s var(--spring) .1s both;transform-origin:50% 0}
@keyframes deal{from{transform:perspective(700px) rotateX(-75deg) translateY(-10px);opacity:0}}
.q-kicker{display:flex;justify-content:space-between;gap:var(--space-2);font:800 12px/16px var(--font-body);color:var(--grape-text);letter-spacing:.07em;text-transform:uppercase}
.q-cat{background:var(--grape);color:var(--on-grape);border-radius:var(--radius-pill);padding:2px 10px;letter-spacing:.04em;white-space:nowrap}
.q-text{font:700 20px/27px var(--font-body);margin:var(--space-3) 0 var(--space-2);text-wrap:balance}
.q-ask{font:700 15px/20px var(--font-body);color:var(--ink-muted)}
.q-seuil{font:700 42px/46px var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;animation:seuil .6s var(--spring) .55s both;transform-origin:0 70%}
@keyframes seuil{from{transform:scale(.6);opacity:0}}
.q-unit{font:700 17px/24px var(--font-body);color:var(--ink-muted)}

/* ---- Mini stats ---- */
.mini{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.m{border-radius:var(--radius-md);padding:10px var(--space-4);color:var(--on-color);display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:var(--space-2)}
.m-lime{background:var(--lime)}.m-coin{background:var(--coin)}
.m-l{font:800 13px/16px var(--font-body);grid-column:1}
.m-s{font:700 12px/16px var(--font-body);opacity:.8;grid-column:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m b{grid-column:2;grid-row:1/3;font:700 30px/1 var(--font-display);font-variant-numeric:tabular-nums}

/* ---- Curseur Plus / Moins ---- */
.slider{--pp:0;--pm:0;display:flex;flex-direction:column;gap:var(--space-2)}
.sl-track{position:relative;height:88px;border-radius:var(--radius-pill);background:var(--surface-raised);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;box-shadow:inset 0 4px 0 var(--card-shadow)}
.sl-fill{position:absolute;inset:0;pointer-events:none}
.sl-fill-m{background:linear-gradient(90deg,var(--sky) 10%,transparent 80%);opacity:var(--pm)}
.sl-fill-p{background:linear-gradient(270deg,var(--mint) 10%,transparent 80%);opacity:var(--pp)}
.sl-side{position:absolute;top:0;bottom:0;width:40%;display:flex;flex-direction:column;justify-content:center;gap:4px;border:0;background:none;cursor:pointer;color:var(--ink);font:700 23px/1 var(--font-display);padding:0 22px;transition:transform .2s var(--out)}
.sl-side small{font:700 12px/14px var(--font-body);color:var(--ink-muted)}
.sl-minus{left:0;align-items:flex-start;transform:scale(calc(1 + var(--pm) * .14));transform-origin:20% 50%;opacity:calc(1 - var(--pp) * .7)}
.sl-plus{right:0;align-items:flex-end;text-align:right;transform:scale(calc(1 + var(--pp) * .14));transform-origin:80% 50%;opacity:calc(1 - var(--pm) * .7)}
.sl-side:active{transform:scale(.94)}
.sl-knob{position:relative;z-index:2;width:72px;height:72px;border-radius:50%;border:0;padding:0;background:none;cursor:grab;touch-action:none;color:var(--on-color)}
.dragging .sl-knob{cursor:grabbing}
.sl-nudge{position:absolute;inset:0;display:block;animation:nudge 2.6s var(--out) 1.4s infinite}
.touched .sl-nudge{animation:none}
@keyframes nudge{0%,55%,100%{transform:none}65%{transform:translateX(16px)}78%{transform:translateX(-16px)}88%{transform:translateX(4px)}}
.sl-coin{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,var(--coin-hi),var(--coin) 52%,var(--coin-lo));border:4px solid var(--on-color);box-shadow:0 6px 0 var(--press);transition:transform .2s var(--spring),box-shadow .2s}
.dragging .sl-coin{transform:scale(1.1);box-shadow:0 12px 18px var(--card-shadow)}
.sl-ring{position:absolute;inset:7px;border-radius:50%;border:3px dashed var(--on-color);opacity:.35}
.sl-face{position:absolute;inset:0;display:grid;place-items:center;font:700 30px/1 var(--font-display);color:var(--on-color);pointer-events:none}
.sl-face::after{content:"?"}
.slider[data-armed="plus"] .sl-face::after{content:"▲"}
.slider[data-armed="moins"] .sl-face::after{content:"▼"}
.slider[data-armed="plus"] .sl-coin,.slider[data-armed="moins"] .sl-coin{animation:armed .5s var(--spring) infinite alternate}
@keyframes armed{to{transform:scale(1.14)}}
.slider.picked .sl-coin{animation:picked .5s var(--spring)}
@keyframes picked{40%{transform:scale(1.3)}}
.slider.locked .sl-side,.slider.locked .sl-knob{pointer-events:none}
.sl-hint{text-align:center;font:800 14px/18px var(--font-body);color:var(--ink-muted);min-height:18px;transition:color .2s}
.slider[data-armed="plus"] .sl-hint,.slider[data-armed="moins"] .sl-hint{color:var(--ink)}
.btn-bank .coin-ico{width:42px;height:42px;flex:none;border-radius:50%;background:radial-gradient(circle at 34% 28%,var(--coin-hi),var(--coin) 52%,var(--coin-lo));border:4px solid var(--on-color);animation:spin 3s linear infinite}
@keyframes spin{0%,70%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
.btn-bank.banked{animation:bankIt .5s var(--spring)}
@keyframes bankIt{30%{transform:scale(.94)}60%{transform:scale(1.04)}}

/* ---- Joueurs ---- */
.players{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.player{display:inline-flex;align-items:center;gap:var(--space-2);border-radius:var(--radius-pill);background:var(--surface-raised);border:2px solid var(--line);padding:3px var(--space-3) 3px 3px;font:700 15px/20px var(--font-body);color:var(--ink);max-width:100%;min-width:0}
.player .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .pts{font:700 14px/1 var(--font-display);color:var(--ink-muted);font-variant-numeric:tabular-nums}
.dot{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--font-display);color:var(--on-color)}
.player.out{opacity:.5}.player.banked{border-color:var(--coin)}.player.me{border-color:var(--grape)}
.player.done .pts::after{content:" ✓"}

/* ---- Révélation ---- */
.answer{background:var(--grape);color:var(--on-grape);border-radius:var(--radius-lg);padding:var(--space-5);animation:flipIn .7s var(--spring) .05s both;transform-origin:50% 50%}
@keyframes flipIn{from{transform:perspective(800px) rotateY(-80deg) scale(.9);opacity:0}}
.answer .lbl{font:700 15px/20px var(--font-body);opacity:.92}
.answer .val{font:700 48px/54px var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin:4px 0}
.answer .val small{font:700 18px/1 var(--font-body)}
.late{opacity:0;transform:translateY(12px)}
.revealed .late{opacity:1;transform:none;transition:opacity .4s var(--out),transform .5s var(--spring);transition-delay:calc(var(--j,0) * 90ms)}
.rows{display:grid;gap:var(--space-2)}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--space-3);background:var(--surface-raised);border-radius:var(--radius-md);padding:var(--space-3)}
.row .who{min-width:0}
.row .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who span{font:600 14px/18px var(--font-body);color:var(--ink-muted)}
.tag{font:700 15px/1 var(--font-display);border-radius:var(--radius-sm);padding:8px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag-win{background:var(--lime);color:var(--on-color)}.tag-bank{background:var(--coin);color:var(--on-color)}.tag-bust{background:var(--bust);color:var(--on-bust)}.tag-idle{background:var(--line);color:var(--ink)}
.toast{border-radius:var(--radius-lg);padding:var(--space-3) var(--space-5);font:700 22px/28px var(--font-display);text-align:center}
.toast-win{background:var(--lime);color:var(--on-color)}.toast-bank{background:var(--coin);color:var(--on-color)}.toast-bust{background:var(--bust);color:var(--on-bust)}

/* ---- Passage du téléphone ---- */
.pass{flex:1 1 auto!important;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4);text-align:center}
.bigdot{position:relative;width:124px;height:124px;border-radius:50%;display:grid;place-items:center;font:700 58px/1 var(--font-display);color:var(--on-color);background:var(--c);animation:popIn .7s var(--spring) .1s both}
.bigdot::before,.bigdot::after{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid var(--c);animation:ring 2.2s var(--out) infinite}
.bigdot::after{animation-delay:1.1s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.8);opacity:0}}
@keyframes popIn{from{transform:scale(.3);opacity:0}}
.pass h2{font-size:34px;line-height:38px}
.pipbox{background:var(--bubble);border-radius:var(--radius-xl);padding:var(--space-4) var(--space-4) 0;width:min(52vw,180px);animation:popIn .7s var(--spring) .1s both}
.pipbox .pipsvg{width:100%;height:auto;margin-bottom:-4px}
.pipbox .pip-wob{animation:bob 2.4s ease-in-out infinite}

/* ---- Formulaires ---- */
.panel{background:var(--surface-raised);border-radius:var(--radius-lg);padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)}
.lab{font:800 13px/16px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted)}
.field{display:block;width:100%;height:52px;min-height:52px;-webkit-appearance:none;appearance:none;border-radius:var(--radius-md);border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 17px/normal var(--font-body);padding:0 var(--space-4);margin:0;transition:border-color .2s}
.field:focus{outline:none;border-color:var(--grape)}
.field.code{height:60px;font:700 28px/normal var(--font-display);letter-spacing:.2em;text-transform:uppercase;text-align:center}

function nice(x){const p=Math.pow(10,Math.floor(Math.log10(x))-1);return +(Math.round(x/p)*p).toPrecision(6)}

/* Seuil tiré au hasard autour de la vraie valeur, jamais égal à elle */
function makeThreshold(v,unit,hard){
  if(unit==="y"){
    let off=(hard?2+(rnd()*5|0):5+(rnd()*36|0))*(rnd()<.5?-1:1);
    if(v+off>2026) off=-Math.abs(off);
    return v+off;
  }
  const up = rnd()<.5;
  const r = hard ? (up?1.04+rnd()*.07:.89+rnd()*.07) : (up ? 1.12+rnd()*.5 : .6+rnd()*.28);
  let t;
  if(Number.isInteger(v) && v<20){
    const d=Math.max(1,Math.round(Math.abs(v*(r-1))));
    t = up ? v+d : v-d;
    if(t<1) t=v+d;
  } else {
    t = nice(v*r);
    if(t===v || (up && t<v) || (!up && t>v)) t = +(v*(up?(hard?1.06:1.3):(hard?.94:.7))).toPrecision(3);
  }
  return t;
}
function dealFrom(deck, qi, hard){
  const [cat,label,value,unit]=QUESTIONS[deck[qi % deck.length]];
  const t=makeThreshold(value,unit,hard);
  return {cat,label,value,unit,t,good:value>t?"plus":"moins"};
}

/* ---------- Moteur de jeu (partagé local / en ligne) ---------- */
const START = 100;
function newGame(players,mode,nq){
  return {id:rnd().toString(36).slice(2,8),risky:mode==="serie"?3+Math.floor(rnd()*(nq-4)):0,players:players.map((p,i)=>({id:p.id||("p"+i),name:p.name,color:COLORS[i%COLORS.length],pts:START,zeroAt:0})),

function nextQuestion(g){g.qn++;g.q=dealFrom(g.deck,g.qi,isRisky(g));g.qi=(g.qi+1)%g.deck.length;g.phase="choose";g.results=null;g.next=null}
function activePlayers(g){return g.players.filter(p=>p.pts>0)}
/* Les deux dernières questions d'une série comptent double */
const isFinale = g => g.mode==="serie" && g.nq>=4 && g.qn>g.nq-2;
/* Une question au hasard de la série est à risque : seuil serré, gains et pertes doublés */
const isRisky = g => g.mode==="serie" && g.risky>0 && g.qn===g.risky;
const multOf = g => (isFinale(g)||isRisky(g))?2:1;
const announceKey = g => g.id+"-"+g.qn;
/* Mise minimale, en part des points : elle monte au fil de la partie */
function minPct(g){
  if(g.mode==="serie"){
    if(isFinale(g))return .25;
    const t=g.nq/3;return g.qn<=t?.10:g.qn<=2*t?.15:.20;
  }
  return Math.min(1,.10+.10*Math.floor((g.qn-1)/2));
}
/* Bornes de la mise de base : minimum = part minimale, maximum = tapis (tous les points) */
function betRange(g,p){
  const m=multOf(g),pts=p.pts;
  const lo=Math.max(1,Math.min(pts,Math.round(pts*minPct(g))));
  const minS=Math.max(1,Math.ceil(lo/m)),capS=Math.max(minS,Math.ceil(pts/m));
  return {minS,capS,m};
}
const effStake=(p,s,m)=>Math.min(p.pts,s*m);
function betOptions(g,p){
  const {minS,capS,m}=betRange(g,p);
  const c=[minS,Math.round(capS*.25),Math.round(capS*.5),Math.round(capS*.75),capS].filter(v=>v>=minS&&v<=capS);
  return [...new Set(c)].sort((a,b)=>a-b).map((s,i,a)=>({s,e:effStake(p,s,m),first:i===0,last:i===a.length-1}));
}
function clampBet(g,p,b){const {minS,capS}=betRange(g,p);b=Math.round(+b);if(!(b>=minS))b=minS;return Math.min(b,capS)}
function resolve(g,choices){
  const m=multOf(g),res=[];
  for(const p of g.players){
    if(p.pts<=0){res.push({id:p.id,outcome:"idle"});continue}
    const c=choices[p.id]||{},side=c.side==="moins"?"moins":"plus";
    const bet=clampBet(g,p,c.bet),e=effStake(p,bet,m),ok=side===g.q.good,before=p.pts;
    p.pts=ok?before+e:before-e;
    if(p.pts<=0){p.pts=0;p.zeroAt=g.qn}
    res.push({id:p.id,side,bet,e,ok,before,after:p.pts,outcome:ok?"win":"lose"});
  }

  if(g.mode==="subite"&&g.players.some(p=>p.pts<=0))g.next="end";

/* Curseur : glisser la pièce, ou toucher un côté, ou flèches du clavier */
function mountSlider(root,onPick){
  const tr=root.querySelector(".sl-track"),kn=root.querySelector(".sl-knob"),ring=root.querySelector(".sl-ring"),hint=root.querySelector(".sl-hint");
  const lbl={plus:root.querySelector(".sl-plus span").textContent,moins:root.querySelector(".sl-minus span").textContent};
  const idle="Glisse la pièce vers ta réponse";
  let p=0,drag=null,armed="";
  const max=()=>Math.max(10,(tr.clientWidth-kn.offsetWidth)/2-8);
  function set(v,anim){
    p=Math.max(-1,Math.min(1,v));const x=p*max();
    const tz=anim?"transform .55s cubic-bezier(.34,1.56,.64,1)":"none";kn.style.transition=tz;ring.style.transition=tz;
    kn.style.transform=`translateX(${x}px)`;ring.style.transform=`rotate(${x/34}rad)`;
    root.style.setProperty("--pp",Math.max(0,p).toFixed(3));root.style.setProperty("--pm",Math.max(0,-p).toFixed(3));
    kn.setAttribute("aria-valuenow",p.toFixed(2));
    const a=p>.66?"plus":p<-.66?"moins":"";
    if(a!==armed){armed=a;root.dataset.armed=a;hint.textContent=a?`Lâche pour valider : ${lbl[a]}`:idle;if(a)buzz(8)}
  }
  function commit(side){
    if(root.classList.contains("locked"))return;
    root.classList.add("touched","picked","locked");set(side==="plus"?1:-1,true);
    root.dataset.armed=side;hint.textContent=`Choix : ${lbl[side]}`;buzz([12,40,18]);
    setTimeout(()=>onPick(side),520);
  }
  kn.addEventListener("pointerdown",e=>{if(root.classList.contains("locked"))return;e.preventDefault();root.classList.add("touched","dragging");drag={x:e.clientX,p0:p,id:e.pointerId};try{kn.setPointerCapture(e.pointerId)}catch(_){}});
  kn.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;set(drag.p0+(e.clientX-drag.x)/max())});
  kn.addEventListener("pointerup",()=>{if(!drag)return;drag=null;root.classList.remove("dragging");if(armed)commit(armed);else set(0,true)});
  kn.addEventListener("pointercancel",()=>{drag=null;root.classList.remove("dragging");set(0,true)});
  root.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>commit(b.dataset.pick)));
  kn.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowUp"){e.preventDefault();commit("plus")}else if(e.key==="ArrowLeft"||e.key==="ArrowDown"){e.preventDefault();commit("moins")}});
  set(0);
}
function announceBlock(){
  return `<div class="pass st"><div class="bigdot" style="--c:var(--coin)">×2</div><h2>Question à risque</h2><p class="muted">Gains doublés, mais pertes doublées aussi. Le seuil est serré : réfléchis bien avant de miser.</p></div>${goBtn("Compris","ann")}`;
}
function wireChoose(cb){
  const sl=$(".slider"),bet=$(".bet"),chips=$$(".chip"),pts=+bet.dataset.pts;let sel=chips[0],done=false;
  const pick=c=>{
    sel=c;chips.forEach(x=>x.setAttribute("aria-checked",x===c));const e=+c.dataset.e;
    $("#bwin").textContent="+"+fmt(e);$("#blose").textContent="−"+fmt(e);
    $("#bwr").textContent="→ "+fmt(pts+e);$("#blr").textContent="→ "+fmt(pts-e);
    if(!RM)["#bwin","#blose"].forEach(s=>$(s).animate([{transform:"scale(1.3)"},{transform:"none"}],{duration:320,easing:"cubic-bezier(.34,1.56,.64,1)"}));
    buzz(6);
  };
  chips.forEach(c=>c.addEventListener("click",()=>{if(!bet.classList.contains("locked"))pick(c)}));
  mountSlider(sl,side=>{if(done)return;done=true;bet.classList.add("locked");cb({side,bet:+sel.dataset.s})});
}
function revealBlock(g,meId){
  const q=g.q, y=q.unit==="y";
  const rows=g.results.map((r,i)=>{
    const p=g.players.find(x=>x.id===r.id);if(!p)return "";
    const tag=r.outcome==="idle"?`<span class="tag tag-idle">à 0 point</span>`:r.ok?`<span class="tag tag-win">Juste</span>`:`<span class="tag tag-bust">Raté</span>`;
    return `<div class="row late" style="--j:${i+1}"><span class="dot" style="background:var(--${p.color})">${initial(p)}</span>
      <div class="who"><b>${esc(p.name)}</b><span>${r.side?choiceName(r.side,q.unit):"—"}</span></div>${tag}</div>`;
  }).join("");
  const played=g.results.filter(r=>r.outcome!=="idle"), mine=meId&&played.find(r=>r.id===meId);
  let toast="";
  if(mine){
    toast=mine.ok?`<div class="toast toast-win late">Bien vu ! +${fmt(mine.e)}<small>Tu passes à ${fmt(mine.after)} points</small></div>`
      :`<div class="toast toast-bust late">Raté, −${fmt(mine.e)}<small>${mine.after>0?"Il te reste "+fmt(mine.after)+" points":"Te voilà à 0 point"}</small></div>`;
  }else if(played.length){
    const w=played.filter(r=>r.ok).length,b=played.length-w;
    toast=`<div class="toast ${b>w?"toast-bust":"toast-win"} late">${[w&&`${w} juste${w>1?"s":""}`,b&&`${b} raté${b>1?"s":""}`].filter(Boolean).join(" · ")}</div>`;
  }
  const stop=g.next==="end"&&g.mode==="subite"?`<p class="note late" style="text-align:center">Un joueur tombe à 0 : la partie s'arrête.</p>`:"";
  return `<div class="answer"><div class="lbl">${esc(q.label)}</div>
    <div class="val"><span class="cnt" data-from="${q.t}" data-to="${q.value}" data-y="${y?1:0}">${y?q.t:fmt(q.t)}</span>${!y&&q.unit?` <small>${esc(q.unit)}</small>`:""}</div>
    <div class="lbl late">Seuil ${y?q.t:fmt(q.t)} : la bonne réponse était <b>${choiceName(q.good,q.unit)}</b></div></div>
    ${toast}${stop}<div class="scroll"><div class="rows">${rows}</div></div>`;
}
/* Lance le compteur puis l'effet ; mood = "good" | "bad" | "" */
function runReveal(mood){
  const s=cur,el=s.querySelector(".cnt");
  countUp(el).then(()=>{if(s!==cur)return;s.classList.add("revealed");
    const ans=s.querySelector(".answer");
    if(mood==="good"){const [x,y]=centerOf(ans);coinBurst(x,y,20);buzz(20)}
    else if(mood==="bad"){shake(ans);flash();buzz([40,60,40])}});
}
function moodOf(results,id){
  const rs=(id?results.filter(r=>r.id===id):results).filter(r=>r.outcome!=="idle");
  if(!rs.length)return "";
  return rs.some(r=>r.ok)?"good":"bad";
}
function nextLabel(g){return g.next==="end"?"Voir le classement":"Question suivante"}
/* Classement : les lignes apparaissent du dernier au premier */
function endBlock(g){

/* ---------- Mode en ligne (Firebase Realtime Database) ---------- */
const FB_VER="10.12.2";
const online={db:null,code:null,ref:null,pid:store.get("pid",null),room:null,busy:false,
  leave(){if(this.ref){this.ref.off();if(this.room&&this.room.status==="lobby")this.ref.child("game/players").once("value").then(s=>{const a=(s.val()||[]).filter(p=>p&&p.id!==this.pid);this.ref.child("game/players").set(a)}).catch(()=>{})}this.ref=null;this.code=null;this.room=null}};
if(!online.pid){online.pid="u"+Math.random().toString(36).slice(2,10);store.set("pid",online.pid)}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ko(new Error("load"));document.head.appendChild(s)})}
async function fb(){
  if(online.db)return online.db;
  if(!settings.firebase) throw new Error("nourl");
  if(!window.firebase){await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/firebase-app-compat.js`);await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/firebase-database-compat.js`)}
  const app=firebase.apps.length?firebase.app():firebase.initializeApp({databaseURL:settings.firebase});
  online.db=app.database();return online.db;
}
function onlineHome(dir){
  const nm=store.get("myname",settings.names[0]||"");
  render(`${topBar("Jouer en ligne")}
   <div class="scroll st"><div class="stack">
    ${settings.firebase?"":`<div class="panel"><b>Adresse Firebase manquante</b><p class="note">Ajoute l'adresse de ta Realtime Database dans Réglages pour jouer en ligne.</p><button class="btn btn-ghost" data-go="settingsView">Ouvrir Réglages</button></div>`}
    <div class="panel"><label class="lab" for="myname">Ton prénom</label><input class="field" id="myname" maxlength="14" value="${esc(nm)}" autocomplete="off"></div>
    <div class="panel"><h3>Créer une partie</h3><p class="note">Tu deviens l'hôte. ${modeText()} Chacun démarre avec ${START} points.</p>
     <button class="btn btn-primary" id="create"><span class="big">Créer</span><span class="ico">${ICON.arrow}</span></button></div>
    <div class="panel"><h3>Rejoindre</h3><label class="lab" for="jcode">Code de la partie</label><input class="field code" id="jcode" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
     <button class="btn btn-plus" id="join"><span class="big">Rejoindre</span><span class="ico">${ICON.arrow}</span></button></div>
    <p class="err" id="oerr" hidden></p>
   </div></div>`,{dir});
  const err=m=>{const e=$("#oerr");e.textContent=m;e.hidden=true;void e.offsetWidth;e.hidden=false;buzz([30,40,30])};
  const getName=()=>{const n=$("#myname").value.trim();if(!n){err("Écris ton prénom pour que les autres te reconnaissent.");return null}store.set("myname",n);return n};
  const fail=e=>err(e.message==="nourl"?"Ajoute d'abord l'adresse Firebase dans Réglages.":e.message==="load"?"Impossible de charger Firebase. Vérifie ta connexion, ou ouvre le jeu depuis son adresse en ligne plutôt que dans Claude.":"Connexion à Firebase impossible. Vérifie l'adresse et les règles de la base.");
  $("#create").onclick=async()=>{const n=getName();if(!n)return;
    try{const db=await fb();const A="ABCDEFGHJKMNPQRSTUVWXYZ";let code;
      for(let k=0;k<6;k++){code=[0,0,0,0].map(()=>A[rnd()*A.length|0]).join("");const s=await db.ref("rooms/"+code+"/status").once("value");if(!s.exists())break}
      const g=newGame([{id:online.pid,name:n}],settings.mode,settings.nq);
      await db.ref("rooms/"+code).set({host:online.pid,status:"lobby",created:Date.now(),game:g});
      enterRoom(code);
    }catch(e){fail(e)}};
  $("#join").onclick=async()=>{const n=getName();if(!n)return;const code=$("#jcode").value.trim().toUpperCase();
    if(code.length!==4){err("Le code fait 4 lettres.");return}
    try{const db=await fb();let why=null;
      const r=await db.ref("rooms/"+code).transaction(room=>{
        if(!room)return null;
        const ps=room.game.players||[];
        if(ps.some(p=>p.id===online.pid)){why=null;return room}
        if(room.status!=="lobby"){why="Cette partie a déjà commencé.";return}
        if(ps.length>=MAX_ONLINE){why="La partie est complète ("+MAX_ONLINE+" joueurs).";return}
        ps.push({id:online.pid,name:n,color:COLORS[ps.length],pts:START,zeroAt:0});room.game.players=ps;return room});
      if(!r.committed||!r.snapshot.exists()){err(why||"Aucune partie avec ce code.");return}
      enterRoom(code);
    }catch(e){fail(e)}};
}
function enterRoom(code){
  online.ann=null;online.code=code;online.ref=online.db.ref("rooms/"+code);
  online.ref.on("value",s=>{const room=s.val();if(!room){render(`${topBar("Partie terminée")}<p class="st">Cette partie n'existe plus.</p>`,{key:"gone",keep:true});return}

  if(!isHost(room)||room.status!=="play"||online.busy)return;

  const ch=room.choices||{};

}

  if(room.status==="lobby"){
    render(`${topBar("Salle d'attente")}

     <div class="spacer"></div>
     ${host?`<button class="btn btn-primary btn-shine st" id="go" ${g.players.length<2?"disabled":""}><span class="lbl"><span class="big">Lancer la partie</span><small>${g.players.length<2?"il faut 2 joueurs":g.players.length+" joueurs"}</small></span><span class="ico">${ICON.arrow}</span></button>`:`<p class="note st" style="text-align:center">L'hôte lance la partie quand tout le monde est là.</p>`}`,{key:"lobby",dir:"up"});
    const b=$("#go");if(b)b.onclick=()=>{g.players.forEach((p,i)=>{p.color=COLORS[i];p.pts=START;p.zeroAt=0});g.qn=0;nextQuestion(g);online.ref.update({status:"play",game:g,choices:null})};

    if(!render(`${endBlock(g)}<div class="grid2 st"><button class="btn btn-ghost" data-go="home">Accueil</button>${host?`<button class="btn btn-primary" id="again" style="justify-content:center">Rejouer</button>`:`<span class="note" style="align-self:center">L'hôte peut relancer.</span>`}</div>`,{key:"oe"+tag,keep:true,dir:"up"}))return;
    revealRanking(g);
    const a=$("#again");if(a)a.onclick=()=>{const ng=newGame(g.players.map(p=>({id:p.id,name:p.name})),g.mode,g.nq);nextQuestion(ng);online.ref.update({game:ng,choices:null})};
    return;
  }
  if(g.phase==="reveal"){
    if(!render(`${playersBar(g)}${revealBlock(g,online.pid)}
     ${host?goBtn(nextLabel(g),"nx"):`<p class="note st" style="text-align:center">L'hôte passe à la suite.</p>`}`,{key:"or"+tag,keep:true,dir:"up"}))return;
    runReveal(moodOf(g.results,online.pid));
    const n=$("#nx");if(n)n.onclick=()=>{advance(g);online.ref.update({game:g,choices:null})};
    return;
  }
  const ch=room.choices||{}, mine=ch[me.id];
  if(me.pts>0 && !mine){
    if(isRisky(g)&&online.ann!==announceKey(g)){
      if(render(`${onlineTop(me)}${announceBlock()}`,{key:"oa"+tag,keep:true,dir:"up"})){buzz([30,50,30]);$("#ann").onclick=()=>{online.ann=announceKey(g);renderOnline(online.room)};$("#oquit").onclick=askQuit}
      return;
    }
    if(!render(`${onlineTop(me)}${chooseBlock(g,me)}`,{key:"oc"+tag,keep:true,dir:"fwd"}))return;
    wireChoose(c=>online.ref.child("choices/"+me.id).set(c));
    $("#oquit").onclick=askQuit;
    return;
  }
  const waiting=activePlayers(g).filter(p=>!ch[p.id]);
  render(`${onlineTop(me)}${playersBar(g,{me:online.pid,done:ch})}${questionCard(g)}
   <div class="pass st"><div class="pipbox" style="width:min(40vw,140px)"><div class="pip-wob">${pip(false)}</div></div><h3>${me.pts>0&&mine?"Choix enregistré : "+choiceName(mine.side,g.q.unit)+" · mise "+fmt(mine.bet):"Tu es à 0 point, tu regardes la suite"}</h3>
   <p class="muted">${waiting.length?"On attend "+waiting.map(p=>esc(p.name)).join(", ")+".":"Révélation…"}</p></div>`,{key:"ow"+tag,dir:"up"});
  $("#oquit").onclick=askQuit;
}

home("up");
</script>
</body>
</html>
